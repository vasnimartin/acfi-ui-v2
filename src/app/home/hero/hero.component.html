<section class="hero-section" *ngIf="{ 
    data: (heroContent$ | async) || editedContent,
    isEdit: (isEditMode$ | async)
} as context">
    <div class="hero-overlay"></div>
    <div class="hero-container">
        <!-- Admin Edit Overlay -->
        <div class="admin-edit-controls" *ngIf="context.isEdit && !editing">
            <button class="btn-cms-edit" (click)="startEdit(context.data)" title="Edit Hero Content">
                <i class="fa-solid fa-pen"></i> Edit Hero
            </button>
        </div>

        <div class="hero-content" *ngIf="!editing">
            <h1 class="hero-title">{{ context.data.title }}</h1>

            <div class="hero-buttons">
                <a routerLink="/contact" class="btn-hero-outline">{{ context.data.button1_text }}</a>
                <a routerLink="/about/who-we-are" class="btn-hero-outline">{{ context.data.button2_text }}</a>
            </div>
        </div>

        <!-- Inline Editor Form -->
        <div class="hero-editor-container" *ngIf="editing">
            <div class="editor-form">
                <div class="form-group">
                    <label>Hero Title</label>
                    <input type="text" [(ngModel)]="editedContent.title" class="cms-input" title="Hero Title">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Button 1 Text</label>
                        <input type="text" [(ngModel)]="editedContent.button1_text" class="cms-input"
                            title="Button 1 Text">
                    </div>
                    <div class="form-group">
                        <label>Button 2 Text</label>
                        <input type="text" [(ngModel)]="editedContent.button2_text" class="cms-input"
                            title="Button 2 Text">
                    </div>
                </div>
                <div class="editor-actions">
                    <button class="btn-cms-save" (click)="saveEdit()" title="Save changes">Save Changes</button>
                    <button class="btn-cms-cancel" (click)="cancelEdit()" title="Cancel changes">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</section>
